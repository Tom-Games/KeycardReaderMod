name: Build Keycard Reader Mod

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        working-directory: KeycardReaderMod_26.3
        run: gradle build --no-daemon
      - name: Upload built JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keycard-reader-build
          path: KeycardReaderMod_26.3/build/libs/*.jar
          if-no-files-found: warn
